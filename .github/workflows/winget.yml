name: Publish release to WinGet

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Download and Run WinGetCreate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_ACC_TOKEN }}
        run: |
          # 1. Fetch the official Microsoft WinGet tool using their smart download router
          Invoke-WebRequest -Uri "https://aka.ms" -OutFile "wingetcreate.exe"
          
          # 2. Pull your pure version string cleanly
          $cleanVersion = "${{ github.event.release.tag_name }}"
          
          # 3. Securely query the direct asset download URL using GitHub's native environment paths
          $repoApiUrl = "https://github.com"
          $releaseData = Invoke-RestMethod -Uri $repoApiUrl
          $installerUrl = $releaseData.assets | Where-Object { $_.name -like "*.exe" } | Select-Object -ExpandProperty browser_download_url -First 1
          
          # 4. Transmit your actual WinGet ID with a clean, raw argument string configuration
          $overrideUrl = $installerUrl + "|x64"
          .\wingetcreate.exe update Citadel5-JP.GS-Calc -s -v $cleanVersion -u "$overrideUrl" -t $env:WINGET_TOKEN
