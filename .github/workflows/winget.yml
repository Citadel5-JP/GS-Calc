name: Publish release to WinGet

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Download and Run WinGetCreate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_ACC_TOKEN }}
        run: |
          # 1. Download the tool directly from Microsoft's production short-link
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"
          
          # 2. Extract your clean installer download URL from the GitHub event
          $githubEvent = Get-Content '${{ github.event_path }}' | ConvertFrom-Json
          $installerUrl = $githubEvent.release.assets | Where-Object { $_.name -ilike "*.exe" } | Select-Object -ExpandProperty browser_download_url -First 1
          
          # 3. Create the exact pipe configuration string needed for a Win64 application
          $overrideUrl = "$installerUrl|x64"
          
          # 4. Pull your pure version string cleanly
          $cleanVersion = "${{ github.event.release.tag_name }}"
          
          # 5. Transmit using a hard single-quoted argument to prevent string splicing errors
          .\wingetcreate.exe update Citadel5-JP.GS-Calc -s -v $cleanVersion -u '$overrideUrl' -t $env:WINGET_TOKEN
