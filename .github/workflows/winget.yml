name: Publish release to WinGet

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install WinGetCreate Tool
        run: winget install Microsoft.WingetCreate --silent --disable-interactivity --accept-source-agreements --accept-package-agreements

      - name: Submit Package Update to Microsoft
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_ACC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Built-in token that lets the 'gh' tool read your live repository
        shell: pwsh
        run: |
          # 1. Grab your version tag name directly from the environment variables
          $cleanVersion = $env:GITHUB_REF_NAME
          
          # 2. Query GitHub's official command line utility to extract your live .exe download link
          # This completely fixes the empty-payload bug on edited events!
          $installerUrl = gh release view $cleanVersion --json assets --jq '.assets[] | select(.name | endswith(".exe")) | .url'
          
          # 3. Explicitly construct the required Win64 architecture constraint override string safely
          $overrideUrl = "${installerUrl}|x64"
          
          # 4. Transmit the aligned arguments to Microsoft's validation queue
          wingetcreate update Citadel5-JP.GS-Calc -s -v $cleanVersion -u $overrideUrl
