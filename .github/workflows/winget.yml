name: Publish release to WinGet

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Download and Run WinGetCreate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_ACC_TOKEN }}
        run: |
          # 1. Fetch the official Microsoft WinGet tool using their smart download router
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"
          
          # 2. Extract your clean installer download URL from the GitHub Release event
          $githubEvent = Get-Content '${{ github.event_path }}' | ConvertFrom-Json
          $installerUrl = $githubEvent.release.assets | Where-Object { $_.name -ilike "*.exe" } | Select-Object -ExpandProperty browser_download_url -First 1
          
          # 3. Pull your pure version string cleanly
          $cleanVersion = "${{ github.event.release.tag_name }}"
          
          # 4. Transmit with an escaped backtick vertical bar to prevent shell pipeline slicing errors
          .\wingetcreate.exe update Citadel5-JP.GS-Calc -s -v $cleanVersion -u "$installerUrl`|x64" -t $env:WINGET_TOKEN
