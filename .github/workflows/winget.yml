name: Publish release to WinGet

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Download and Run WinGetCreate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_ACC_TOKEN }}
        run: |
          Invoke-WebRequest -Uri "https://aka.ms" -OutFile "wingetcreate.exe"
          $githubEvent = Get-Content '${{ github.event_path }}' | ConvertFrom-Json
          
          # 1. Grab your direct .exe installer link
          $installerUrl = $githubEvent.release.assets | Where-Object { $_.name -ilike "*.exe" } | Select-Object -ExpandProperty browser_download_url -First 1
          
          # 2. Safely structure the architecture override without breaking PowerShell's pipeline
          $overrideUrl = "{0}|x64" -f $installerUrl
          
          # 3. Pull your pure version string cleanly
          $cleanVersion = "${{ github.event.release.tag_name }}"
          
          # 4. Transmit using double quotes to keep the pipe literal
          .\wingetcreate.exe update Citadel5-JP.GS-Calc -s -v $cleanVersion -u "$overrideUrl" -t $env:WINGET_TOKEN
