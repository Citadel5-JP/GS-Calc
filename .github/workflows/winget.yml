name: Publish release to WinGet

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Install WinGetCreate Tool
        run: winget install Microsoft.WingetCreate --accept-source-agreements --accept-package-agreements

      - name: Submit Package Update to Microsoft
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_ACC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Built-in token that allows the 'gh' command to read your files
        run: |
          # 1. Pull the version number using the native system variable
          $cleanVersion = $env:GITHUB_REF_NAME
          
          # 2. Use GitHub's official command-line tool to grab the exact .exe installer link 
          # This works perfectly on edited, created, or published events every single time!
          $installerUrl = gh release view $cleanVersion --json assets --jq '.assets[] | select(.name | endswith(".exe")) | .url'
          
          # 3. Create the direct pipe configuration string needed for your Win64 application
          $overrideUrl = $installerUrl + "|x64"
          
          # 4. Push the update cleanly straight to Microsoft
          wingetcreate update Citadel5-JP.GS-Calc -s -v $cleanVersion -u "$overrideUrl"
