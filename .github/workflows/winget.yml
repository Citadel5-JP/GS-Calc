name: Publish release to WinGet

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Install and Run WinGetCreate
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_ACC_TOKEN }}
        run: |
          # 1. Pull the Manifest Creator utility using the native Windows distribution engine
          winget install Microsoft.WingetCreate --accept-source-agreements --accept-package-agreements
          
          # 2. Convert the GitHub release assets list safely using native JSON processing
          $assetsJson = '${{ toJSON(github.event.release.assets) }}' | ConvertFrom-Json
          
          # 3. Extract the clean download URL specifically for your installer file
          $installerUrl = $assetsJson | Where-Object { $_.name -like "*.exe" } | Select-Object -ExpandProperty browser_download_url -First 1
          
          # 4. Pull your version tag cleanly
          $cleanVersion = "${{ github.event.release.tag_name }}"
          
          # 5. Append your required Win64 architecture constraint override
          $overrideUrl = $installerUrl + "|x64"
          
          # 6. Run the tool using its system-wide execution path alias
          wingetcreate update Citadel5-JP.GS-Calc -s -v $cleanVersion -u "$overrideUrl"
