name: Publish release to WinGet

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Install and Run WinGetCreate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_ACC_TOKEN }}
        run: |
          # 1. Use the pre-installed native WinGet tool to safely pull Manifest Creator
          winget install Microsoft.WingetCreate --accept-source-agreements --accept-package-agreements
          
          # 2. Extract your clean installer download URL from the GitHub Release event
          $githubEvent = Get-Content '$env:GITHUB_EVENT_PATH' | ConvertFrom-Json
          $installerUrl = $githubEvent.release.assets | Where-Object { $_.name -like "*.exe" } | Select-Object -ExpandProperty browser_download_url -First 1
          
          # 3. Pull your version tag cleanly
          $cleanVersion = "${{ github.event.release.tag_name }}"
          
          # 4. Explicitly append the architecture suffix safely using a native PowerShell string variable
          $overrideUrl = "${installerUrl}|x64"
          
          # 5. Run the tool using its system-wide execution path alias
          wingetcreate update Citadel5-JP.GS-Calc -s -v $cleanVersion -u $overrideUrl -t $env:WINGET_TOKEN
