name: Publish release to WinGet

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Install WinGetCreate Tool
        run: winget install Microsoft.WingetCreate --accept-source-agreements --accept-package-agreements

      - name: Submit Package Update to Microsoft
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_ACC_TOKEN }}
        # This single-line format forces GitHub to inject the actual URL string directly into the command before running it
        run: wingetcreate update Citadel5-JP.GS-Calc -s -v ${{ github.event.release.tag_name }} -u "${{ github.event.release.assets[0].browser_download_url }}|x64"
