name: Publish release to WinGet

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Install and Run WinGetCreate
        env:
          # Mapping the token to this specific variable removes the logging security warning entirely
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_ACC_TOKEN }}
        run: |
          # 1. Pull the Manifest Creator utility using the native Windows distribution engine
          winget install Microsoft.WingetCreate --accept-source-agreements --accept-package-agreements
          
          # 2. Extract your pure version tag string
          $cleanVersion = "${{ github.event.release.tag_name }}"
          
          # 3. Pull your direct installer link using GitHub's built-in array token parsing shortcuts
          $installerUrl = "${{ github.event.release.assets[0].browser_download_url }}"
          
          # 4. Securely append your required Win64 architecture constraint override
          $overrideUrl = "${installerUrl}|x64"
          
          # 5. Execute the clean structural update payload command without using the legacy token switches
          wingetcreate update Citadel5-JP.GS-Calc -s -v $cleanVersion -u $overrideUrl
