name: Publish release to WinGet

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      # 1. This clones your repository onto the server so the command-line tools don't crash
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install WinGetCreate Tool
        run: winget install Microsoft.WingetCreate --accept-source-agreements --accept-package-agreements

      - name: Submit Package Update to Microsoft
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_ACC_TOKEN }}
        # The single-line command format maps the variables securely before running
        run: |
          wingetcreate update Citadel5-JP.GS-Calc -s -v ${{ github.event.release.tag_name }} -u "${{ github.event.release.assets[0].browser_download_url }}|x64"
